[package]
name = "p2p"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "libp2p transport for replication: gossipsub announcements, request-response pull sync. See docs/04 §Replication between nodes."

# Rust 1.86 (rust-toolchain.toml) needs three pins in Cargo.lock, since newer releases
# require a newer rustc: idna_adapter 1.1.0, multibase 0.9.1 (docs/04 §Replication).
[dependencies]
network = { path = "../network" }
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "request-response", "macros", "ed25519"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
