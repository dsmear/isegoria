[package]
name = "p2p"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "libp2p transport for replication: gossipsub announcements, request-response pull sync. See docs/04 §Replication between nodes."

# Rust 1.86 (rust-toolchain.toml) needs two pins in Cargo.lock, since newer releases
# require a newer rustc: idna_adapter 1.1.0, multibase 0.9.1 (docs/04 §Replication).
[dependencies]
network = { path = "../network" }
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "request-response", "macros", "ed25519"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
futures = "0.3"
async-trait = "0.1"
# T85: Oblivious HTTP (RFC 9458) on the `hpke` crate, and Binary HTTP (RFC 9292); docs/04 §Blind relays.
ohttp = { version = "=0.8.0", default-features = false, features = ["client", "server", "rust-hpke"] }
bhttp = { version = "=0.8.0", default-features = false }
ed25519-dalek = "2"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
protocol = { path = "../protocol" }
identity = { path = "../identity" }
# The reference HPKE path, tests only: RFC 9458 Appendix A and the channel's OHTTP checked against it.
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }
hkdf = "=0.13.0"
sha2 = "=0.11.0"
aes-gcm = "=0.11.1"
