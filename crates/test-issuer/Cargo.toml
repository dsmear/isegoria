[package]
name = "test-issuer"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The provisional single-key test issuer before T19, held by a party that is no member: its key and its side of blind issuance, by files; a person's side is isegoria-client's. See docs/05 §Distributed integration, credentials before T19."

# A crate of its own, so no node links the issuer's secret key (docs/05).
[[bin]]
name = "isegoria-test-issuer"
path = "src/main.rs"

[dependencies]
identity = { path = "../identity" }
getrandom = "0.2"
