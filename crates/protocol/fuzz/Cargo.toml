# cargo-fuzz targets for the protocol decoders (T73, T89). Outside the main workspace on
# purpose: fuzzing needs a nightly toolchain and libFuzzer. See README.md.
[package]
name = "protocol-fuzz"
version = "0.0.0"
edition = "2021"
license = "EUPL-1.2"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
curve25519-dalek = "4"
ed25519-dalek = "2"
identity = { path = "../../identity" }
network = { path = "../../network" }
protocol = { path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "event"
path = "fuzz_targets/event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "answer_event"
path = "fuzz_targets/answer_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "genesis"
path = "fuzz_targets/genesis.rs"
test = false
doc = false
bench = false

[[bin]]
name = "answer_gateway"
path = "fuzz_targets/answer_gateway.rs"
test = false
doc = false
bench = false

[[bin]]
name = "answer_read"
path = "fuzz_targets/answer_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "answer_seal"
path = "fuzz_targets/answer_seal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "answer_cuts"
path = "fuzz_targets/answer_cuts.rs"
test = false
doc = false
bench = false
