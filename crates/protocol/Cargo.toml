[package]
name = "protocol"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Question lifecycle orchestration: deposit, lottery, blind review, bridging gate, appeal, two-stage pilot, honeypot. See docs/05."

[features]
# Variant-1 DIF (`stage2_dif`, `revalidate_pool`): calibration-only (docs/01 D20).
calibration = ["scoring/calibration"]

[dependencies]
scoring = { path = "../scoring" }
identity = { path = "../identity" }
network = { path = "../network" }
ed25519-dalek = "2"
libm = "0.2"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
# The inner seal of T79-P7's read replies: the `hpke` that `ohttp` pins in `p2p` (docs/05).
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }

[dev-dependencies]
proptest = "1"
