[package]
name = "node"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A node as an operating-system process: its configuration file, its files, its status, run until stopped. See docs/04 §A node process."

[[bin]]
name = "isegoria-node"
path = "src/main.rs"

[dependencies]
network = { path = "../network" }
p2p = { path = "../p2p" }
libp2p = { version = "0.56", default-features = false, features = ["ed25519"] }
ed25519-dalek = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
