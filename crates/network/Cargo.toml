[package]
name = "network"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Signed append-only logs, content addressing, Merkle anchoring, consortium checkpoints, erasure coding. See docs/04."

# Self-contained integrity primitives and the replicated set are real; the libp2p
# transport lives in the `p2p` crate, so this one stays free of I/O runtimes. Prefer
# mature libraries, bespoke crypto only as a tested, documented exception.
[dependencies]
sha2 = "0.10"
ed25519-dalek = "2"
reed-solomon-erasure = "6"
# OpenTimestamps proof format (parse/build/verify). MIT/Apache-2.0. See docs/04.
opentimestamps = "0.2"

[dev-dependencies]
proptest = "1"
ed25519-dalek = "2"
